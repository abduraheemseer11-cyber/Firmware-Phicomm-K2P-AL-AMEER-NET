# Alameer mesh failover settings
BRIDGE="br-lan"
MESH_IF="mesh0"
INTERVAL=1          # seconds between link checks
DOWN_DELAY=5        # seconds the cable must stay down before the mesh is bridged
UPLINK_PORTS=""     # empty = any wired bridge port counts as "cable connected"; e.g. "lan1"
GATE_MODE=0         # 0 = mesh bridged only while cable is down (loop-safe)
                    # 1 = mesh ALWAYS bridged + STP on (lets wired neighbours relay; test first)
