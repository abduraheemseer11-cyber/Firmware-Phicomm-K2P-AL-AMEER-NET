name: Build Alameer Firmware (Padavan)

on:
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Firmware with TurBoTse's Action
      uses: TurBoTse/Padavan-Build@main
      with:
        targets: K2P
        # يمكنك إضافة خيارات التخصيص هنا لاحقاً، مثل:
        # customization: '{"lanip":"192.168.1.20"}'
        # release: true
