name: Build Alameer Firmware (Phicomm K2P)

on:
  workflow_dispatch:
    inputs:
      disable_failsafe:
        description: 'Also remove failsafe mode (reset button at boot). WARNING: no recovery via failsafe'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt
  SOURCE_BRANCH: openwrt-24.10
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt source
        run: git clone --depth 1 -b $SOURCE_BRANCH $SOURCE_REPO openwrt

      - name: Custom feeds (part 1)
        run: |
          cd openwrt
          bash ../scripts/diy-part1.sh

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Alameer customization (part 2)
        env:
          DISABLE_FAILSAFE: ${{ inputs.disable_failsafe && '1' || '0' }}
        run: |
          chmod +x files/etc/uci-defaults/* files/etc/rc.button/* files/etc/init.d/* files/usr/sbin/*
          cp -r package/luci-app-alameer-quick openwrt/package/
          rm -rf openwrt/files && cp -r files openwrt/files
          cp config/k2p.config openwrt/.config
          cd openwrt
          bash ../scripts/diy-part2.sh
          make defconfig

      - name: Verify configuration
        run: |
          cd openwrt
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y' .config \
            || { echo "::error::Phicomm K2P target not selected"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-i18n-base-ar=y' .config \
            || echo "::warning::luci-i18n-base-ar not selected -> firmware will fall back to English"
          grep -q '^CONFIG_PACKAGE_luci-i18n-package-manager-ar=y' .config \
            || echo "::warning::luci-i18n-package-manager-ar not selected"
          grep -E 'i18n|zh-cn|default-settings' .config | grep -v '^#' || true

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Verify image contents
        run: |
          ROOT=$(find openwrt/build_dir -maxdepth 3 -type d -name 'root-ramips' | head -1)
          echo "rootfs: $ROOT"
          for f in etc/uci-defaults/99-custom-settings etc/rc.button/reset usr/sbin/alameer-wifi usr/sbin/alameer-quick etc/banner; do
            [ -e "$ROOT/$f" ] && echo "OK  $f" || { echo "::error::missing $f in rootfs"; exit 1; }
          done
          cat "$ROOT/etc/rc.button/reset"
          ls "$ROOT"/etc/uci-defaults/
          ls "$ROOT"/usr/lib/lua/luci/i18n 2>/dev/null | grep -E 'base\.(ar|en)' || echo "::warning::no Arabic LuCI translation in rootfs"

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt/bin/targets/ramips/mt7621/*phicomm_k2p* out/
          cp openwrt/bin/targets/ramips/mt7621/*.manifest out/ || true
          ls -lh out
          SYS=$(ls out/*squashfs-sysupgrade.bin)
          SIZE=$(stat -c %s "$SYS"); echo "sysupgrade size: $SIZE bytes"
          [ "$SIZE" -le 16187392 ] || { echo "::error::image larger than flash partition (15808k)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Alameer-K2P-firmware
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
