name: Build OpenWrt 23.05 - KT GiGA WiFi Wave2 (KM08-708H)

on:
  workflow_dispatch:
  push:
    tags: ['km08-v*']

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/openwrt/openwrt
  SOURCE_BRANCH: openwrt-23.05
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt 23.05
        run: git clone --depth 1 -b $SOURCE_BRANCH $SOURCE_REPO openwrt

      - name: Feeds (official + Argon)
        run: |
          cd openwrt
          bash ../km08-708h/scripts/feeds-extra.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add KM08-708H device support
        run: bash km08-708h/scripts/add-device.sh openwrt

      - name: Install files/ overlay, mesh key and .config
        env:
          MESH_KEY_SECRET: ${{ secrets.MESH_KEY }}
        run: |
          chmod +x km08-708h/files/etc/uci-defaults/* km08-708h/files/etc/init.d/* \
                   km08-708h/files/usr/bin/* km08-708h/files/usr/sbin/*
          rm -rf openwrt/files
          cp -r km08-708h/files openwrt/files

          KEY="$MESH_KEY_SECRET"
          if [ -z "$KEY" ]; then
            KEY=$(openssl rand -base64 24 | tr -d '/+=\n' | cut -c1-20)
            echo "$KEY" > mesh-key.txt
            echo "::notice::No MESH_KEY secret set - a random mesh key was generated (see mesh-key.txt in the artifacts)"
          fi
          echo "::add-mask::$KEY"
          [ "${#KEY}" -ge 8 ] || { echo "::error::mesh key must be at least 8 characters"; exit 1; }
          printf '%s\n' "$KEY" > openwrt/files/etc/alameer/mesh.key
          chmod 600 openwrt/files/etc/alameer/mesh.key

          cp km08-708h/config/km08-708h.config openwrt/.config
          cd openwrt && make defconfig

      - name: Verify configuration
        run: |
          cd openwrt
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_kt_km08-708h=y' .config \
            || { echo "::error::kt_km08-708h not selected (device definition not picked up)"; exit 1; }
          for p in luci-theme-argon lldpd luci-app-lldpd kmod-8021q wpad-mesh-openssl iw-full luci-i18n-base-ar luci-i18n-opkg-ar; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || echo "::warning::$p is not selected"
          done

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Verify image contents
        run: |
          ROOT=$(find openwrt/build_dir -maxdepth 3 -type d -name 'root-ramips' | head -1)
          for f in etc/uci-defaults/99-custom-settings etc/config/network etc/config/dhcp usr/bin/mesh-failover.sh \
                   usr/sbin/alameer-wifi etc/init.d/mesh-failover etc/alameer/mesh.key; do
            [ -e "$ROOT/$f" ] && echo "OK  $f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt/bin/targets/ramips/mt7621/*kt_km08-708h* out/
          cp openwrt/bin/targets/ramips/mt7621/*.manifest out/ || true
          [ -f mesh-key.txt ] && cp mesh-key.txt out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Alameer-KM08-708H-firmware
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*initramfs*
            out/*sysupgrade*
            out/*.manifest
